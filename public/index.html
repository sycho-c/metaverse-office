<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Claude Office — 세션 모니터</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏢</text></svg>" />
<style>
  :root {
    /* Claude Office Design System — Design Tokens */
    --bg: #F0F3F8;          /* surface.background */
    --panel: #FFFFFF;       /* surface.areaCard */
    --panel2: #F8FAFC;      /* header */
    --line: #CBD5E1;        /* border */
    --text: #0F172A;        /* text.primary */
    --secondary: #334155;   /* text.secondary */
    --dim: #64748B;         /* text.tertiary */
    --disabled: #94A3B8;
    --working: #22C55E;     /* semantic.success */
    --done: #3B82F6;        /* semantic.info */
    --blocked: #F59E0B;     /* semantic.warning */
    --stalled: #EF4444;     /* semantic.danger */
    --unknown: #64748B;     /* semantic.neutral */
    --primary-50: #E8F0FE;
    --primary-100: #D2E3FC;
    --primary-200: #A9C8F9;
    --primary-500: #3B82F6;
    --primary-700: #1D4ED8;
    /* radius */ --r-sm: 8px; --r-md: 12px; --r-lg: 16px;
    /* shadow */ --sh-sm: 0 1px 2px rgba(15,23,42,.06); --sh-md: 0 4px 12px rgba(15,23,42,.10); --sh-lg: 0 12px 24px rgba(15,23,42,.15);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
    display: flex; flex-direction: column;
  }

  header {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 16px;
    background: var(--panel2);
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 20px; line-height: 28px; font-weight: 700; margin: 0; letter-spacing: -.2px; color: var(--text); }
  header h1 .sub { color: var(--dim); font-weight: 400; font-size: 12px; margin-left: 8px; }
  .chips { display: flex; gap: 8px; margin-left: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 999px;
    background: #F1F5F9; color: var(--dim);
  }
  .chip b { font-size: 13px; font-weight: 800; }
  .chip.working { background: #DCFCE7; color: #16A34A; }
  .chip.blocked { background: #FEF3C7; color: #D97706; }
  .chip.stalled { background: #FEE2E2; color: #DC2626; }
  .chip.done { background: #DBEAFE; color: #2563EB; }
  .chip .dot { display: none; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.working { background: var(--working); }
  .dot.done { background: var(--done); }
  .dot.blocked { background: var(--blocked); }
  .dot.stalled { background: var(--stalled); }
  .spacer { flex: 1; }
  label.toggle { font-size: 12px; color: var(--dim); display: flex; gap: 6px; align-items: center; cursor: pointer; user-select: none; }
  #conn { font-size: 11px; color: var(--dim); }
  #conn.on { color: var(--working); }
  #conn.off { color: var(--stalled); }

  main { flex: 1; display: flex; min-height: 0; }
  #canvas-wrap {
    flex: 1; overflow: auto; padding: 14px;
    display: flex; justify-content: center; align-items: flex-start;
    background: var(--outside, #aab0ba);   /* 오피스 밖 영역(테마별 색) */
    transition: background .25s ease;
  }
  /* 테마 선택 드롭다운 */
  .theme-sel {
    font: inherit; font-size: 12px; color: var(--secondary);
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 999px; padding: 5px 10px; cursor: pointer; outline: none;
  }
  .theme-sel:hover { border-color: var(--dim); }
  /* Claude 서비스 상태 칩 */
  .cstatus {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--line); color: var(--secondary);
    text-decoration: none; white-space: nowrap; cursor: pointer;
    transition: border-color .15s;
  }
  .cstatus:hover { border-color: var(--dim); }
  .cstatus .cstatus-dot {
    width: 9px; height: 9px; border-radius: 50%; background: #94A3B8; flex-shrink: 0;
    box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 0%, #94A3B8 22%);
  }
  .cstatus.live .cstatus-dot { animation: cstatus-pulse 2s ease-in-out infinite; }
  @keyframes cstatus-pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
  canvas#office {
    image-rendering: pixelated;
    border-radius: 10px;
    box-shadow: 0 8px 40px rgba(0,0,0,.15);
    cursor: pointer;
  }

  aside#panel {
    width: 340px; min-width: 340px;
    background: var(--bg);
    border-left: 1px solid var(--line);
    overflow-y: auto;
    padding: 16px;
  }
  aside h2 { font-size: 12px; color: var(--dim); margin: 2px 2px 12px; font-weight: 700; letter-spacing: 1.2px; }
  /* 헤더 사용량 미니바 (확대) */
  .hu { display: flex; align-items: center; gap: 22px; margin-right: 10px; }
  .hu-item { display: flex; align-items: center; gap: 9px; cursor: default; }
  .hu-lbl { font-size: 13px; color: var(--dim); }
  .hu-track { width: 120px; height: 10px; border-radius: 6px; background: #e4e7ec; overflow: hidden; }
  .hu-fill { display: block; height: 100%; width: 0; border-radius: 6px; background: var(--working); transition: width .4s ease; }
  .hu-pct { font-size: 15px; font-weight: 800; color: var(--text); min-width: 42px; text-align: right; }
  .hu-cost { font-size: 13px; color: var(--dim); font-weight: 600; }
  .hu-reset { display: none; }
  .item {
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 7px solid var(--unknown);
    border-radius: var(--r-md);
    padding: 12px 14px 12px;
    margin-bottom: 12px;
    cursor: pointer;
    box-shadow: var(--sh-sm);
    transition: box-shadow .15s, border-color .15s, transform .1s;
  }
  .item:hover { box-shadow: var(--sh-md); transform: translateY(-1px); }
  .item.working { border-left-color: var(--working); }
  .item.done { border-left-color: var(--done); }
  .item.blocked { border-left-color: var(--blocked); }
  .item.stalled { border-left-color: var(--stalled); }
  .item.unknown { border-left-color: var(--unknown); }
  .item.hl { border-color: var(--primary-500); box-shadow: 0 0 0 2px rgba(59,130,246,.35); }
  .item .row1 { display: flex; align-items: center; gap: 8px; }
  .item .name { font-size: 14px; line-height: 20px; font-weight: 700; color: var(--text); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Tags (Status) — 디자인 시스템 pill */
  .badge { font-size: 11px; line-height: 14px; padding: 4px 10px; border-radius: 999px; font-weight: 600; flex-shrink: 0; }
  .badge.working { background: #DCFCE7; color: #16A34A; }
  .badge.done { background: #DBEAFE; color: #2563EB; }
  .badge.blocked { background: #FEF3C7; color: #D97706; }
  .badge.stalled { background: #FEE2E2; color: #DC2626; }
  .badge.unknown { background: #F1F5F9; color: #64748B; }
  .item .resp {
    font-size: 12px; color: var(--secondary); margin-top: 8px; line-height: 16px;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .item .lastreq {
    font-size: 13px; color: var(--primary-700); margin-top: 8px; line-height: 1.5;
    background: var(--primary-50); border: 1px solid var(--primary-100); border-left: 3px solid var(--primary-500);
    border-radius: var(--r-sm); padding: 7px 9px;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .item .meta { font-size: 11px; line-height: 14px; color: var(--dim); margin-top: 9px; display: flex; gap: 10px; }

  #toasts { position: fixed; right: 350px; top: 64px; z-index: 50; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  .toast {
    background: #DBEAFE; border: 1px solid #BFDBFE;
    border-left: 5px solid var(--done);
    border-radius: var(--r-md); padding: 11px 16px; font-size: 14px; font-weight: 600; color: var(--text);
    box-shadow: var(--sh-lg);
    animation: slidein .25s ease;
  }
  .toast.working { border-left-color: var(--working); background: #DCFCE7; border-color: #BBF7D0; }
  .toast.done    { border-left-color: var(--done);    background: #DBEAFE; border-color: #BFDBFE; }
  .toast.blocked { border-left-color: var(--blocked); background: #FEF3C7; border-color: #FDE68A; }
  .toast.stalled { border-left-color: var(--stalled); background: #FEE2E2; border-color: #FECACA; }
  @keyframes slidein { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: none; } }
  .toast.bye { opacity: 0; transition: opacity .4s; }
</style>
</head>
<body>
  <header>
    <h1>🏢 Claude Office<span class="sub">세션 메타버스 모니터</span></h1>
    <div class="chips">
      <span class="chip working">작업중 <b id="c-working">0</b></span>
      <span class="chip blocked">입력 대기 <b id="c-blocked">0</b></span>
      <span class="chip stalled">멈춤 의심 <b id="c-stalled">0</b></span>
      <span class="chip done">완료 <b id="c-done">0</b></span>
    </div>
    <div class="spacer"></div>
    <a id="claude-status" class="cstatus" href="https://status.claude.com" target="_blank" rel="noopener" title="Claude 서비스 상태">
      <span class="cstatus-dot"></span><span class="cstatus-label">Claude 상태…</span>
    </a>
    <div id="usage" class="hu" style="display:none">
      <span class="hu-item" id="u5item"><span class="hu-lbl">5시간</span><span class="hu-track"><span class="hu-fill" id="u5fill"></span></span><span class="hu-pct" id="u5pct">–</span></span>
      <span class="hu-item" id="uwitem"><span class="hu-lbl">주간</span><span class="hu-track"><span class="hu-fill" id="uwfill"></span></span><span class="hu-pct" id="uwpct">–</span></span>
      <span class="hu-cost" id="ucost"></span>
      <span class="hu-reset" id="u5reset" hidden></span><span class="hu-reset" id="uwreset" hidden></span>
    </div>
    <select id="theme-select" class="theme-sel" title="테마 선택"></select>
    <label class="toggle"><input type="checkbox" id="hide-done" />완료 숨기기</label>
    <span id="conn">연결 중…</span>
  </header>
  <main>
    <div id="canvas-wrap"><canvas id="office" width="800" height="600"></canvas></div>
    <aside id="panel">
      <h2>SESSIONS</h2>
      <ul id="list" style="list-style:none;margin:0;padding:0"></ul>
    </aside>
  </main>
  <div id="toasts"></div>
  <script src="app.js"></script>
</body>
</html>
