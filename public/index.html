<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Claude Office — 세션 모니터</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏢</text></svg>" />
<style>
  :root {
    /* Claude Office Design System — Design Tokens */
    --bg: #F0F3F8;          /* surface.background */
    --panel: #FFFFFF;       /* surface.areaCard */
    --panel2: #F8FAFC;      /* header */
    --line: #CBD5E1;        /* border */
    --text: #0F172A;        /* text.primary */
    --secondary: #334155;   /* text.secondary */
    --dim: #64748B;         /* text.tertiary */
    --disabled: #94A3B8;
    --working: #22C55E;     /* semantic.success */
    --done: #3B82F6;        /* semantic.info */
    --blocked: #F59E0B;     /* semantic.warning */
    --stalled: #EF4444;     /* semantic.danger */
    --unknown: #64748B;     /* semantic.neutral */
    --primary-50: #E8F0FE;
    --primary-100: #D2E3FC;
    --primary-200: #A9C8F9;
    --primary-500: #3B82F6;
    --primary-700: #1D4ED8;
    /* radius */ --r-sm: 8px; --r-md: 12px; --r-lg: 16px;
    /* shadow */ --sh-sm: 0 1px 2px rgba(15,23,42,.06); --sh-md: 0 4px 12px rgba(15,23,42,.10); --sh-lg: 0 12px 24px rgba(15,23,42,.15);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
    display: flex; flex-direction: column;
  }

  header {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 16px;
    background: var(--panel2);
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 20px; line-height: 28px; font-weight: 700; margin: 0; letter-spacing: -.2px; color: var(--text); }
  header h1 .sub { color: var(--dim); font-weight: 400; font-size: 12px; margin-left: 8px; }
  .chips { display: flex; gap: 8px; margin-left: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 999px;
    background: #F1F5F9; color: var(--dim);
  }
  .chip b { font-size: 13px; font-weight: 800; }
  .chip.working { background: #DCFCE7; color: #16A34A; }
  .chip.blocked { background: #FEF3C7; color: #D97706; }
  .chip.stalled { background: #FEE2E2; color: #DC2626; }
  .chip.done { background: #DBEAFE; color: #2563EB; }
  .chip .dot { display: none; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.working { background: var(--working); }
  .dot.done { background: var(--done); }
  .dot.blocked { background: var(--blocked); }
  .dot.stalled { background: var(--stalled); }
  .spacer { flex: 1; }
  label.toggle { font-size: 12px; color: var(--dim); display: flex; gap: 6px; align-items: center; cursor: pointer; user-select: none; }
  #conn { font-size: 11px; color: var(--dim); }
  #conn.on { color: var(--working); }
  #conn.off { color: var(--stalled); }

  main { flex: 1; display: flex; min-height: 0; }
  #canvas-wrap {
    flex: 1; overflow: auto; padding: 14px;
    display: flex; justify-content: center; align-items: flex-start;
    background: var(--outside, #aab0ba);   /* 오피스 밖 영역(테마별 색) */
    transition: background .25s ease;
  }
  /* 테마 선택 드롭다운 */
  .theme-sel {
    font: inherit; font-size: 12px; color: var(--secondary);
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 999px; padding: 5px 10px; cursor: pointer; outline: none;
  }
  .theme-sel:hover { border-color: var(--dim); }
  /* Claude 서비스 상태 칩 */
  .cstatus {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--line); color: var(--secondary);
    text-decoration: none; white-space: nowrap; cursor: pointer;
    transition: border-color .15s;
  }
  .cstatus:hover { border-color: var(--dim); }
  .cstatus .cstatus-dot {
    width: 9px; height: 9px; border-radius: 50%; background: #94A3B8; flex-shrink: 0;
    box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 0%, #94A3B8 22%);
  }
  .cstatus.live .cstatus-dot { animation: cstatus-pulse 2s ease-in-out infinite; }
  @keyframes cstatus-pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
  /* 플레이어 조작 힌트 */
  .controls-hint {
    position: fixed; left: 24px; bottom: 18px; z-index: 40;
    display: flex; align-items: center; gap: 8px;
    background: rgba(20,22,28,.82); color: #fff; backdrop-filter: blur(6px);
    font-size: 12px; font-weight: 500; padding: 8px 14px; border-radius: 999px;
    box-shadow: 0 4px 16px rgba(0,0,0,.25); pointer-events: none;
    transition: opacity .4s;
  }
  .controls-hint kbd {
    font: inherit; font-weight: 700; background: rgba(255,255,255,.18);
    border-radius: 5px; padding: 1px 6px; margin: 0 1px;
  }
  /* 세션 내용 보기 오버레이 (읽기 전용) */
  .sess-ov {
    position: fixed; inset: 0; z-index: 60;
    display: flex; align-items: center; justify-content: center;
    background: rgba(10,12,18,.45); backdrop-filter: blur(3px);
  }
  .sess-card {
    width: min(640px, 92vw); max-height: 82vh; background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: var(--r-lg);
    box-shadow: var(--sh-lg); padding: 16px 18px 14px;
    display: flex; flex-direction: column; gap: 10px;
    animation: talk-in .18s ease;
  }
  @keyframes talk-in { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
  .sess-head { display: flex; align-items: center; gap: 8px; }
  .sess-head .sess-name { font-size: 15px; font-weight: 700; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sess-badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; color: #fff; white-space: nowrap; }
  .sess-badge.working { background: var(--working); }
  .sess-badge.done    { background: var(--done); }
  .sess-badge.blocked { background: var(--blocked); }
  .sess-badge.stalled { background: var(--stalled); }
  .sess-live { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 700; color: var(--working); letter-spacing: .02em; }
  .sess-live i { width: 6px; height: 6px; border-radius: 50%; background: var(--working); animation: sess-pulse 1.4s ease-in-out infinite; }
  @keyframes sess-pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
  .sess-x { font: inherit; font-size: 13px; cursor: pointer; border: 1px solid var(--line); background: var(--panel2); color: var(--secondary); border-radius: 999px; padding: 4px 12px; }
  .sess-x:hover { border-color: var(--dim); }
  .sess-detail { font-size: 12.5px; color: var(--secondary); line-height: 1.5; background: var(--panel2); border: 1px solid var(--line); border-radius: var(--r-md); padding: 9px 11px; }
  .sess-msgs { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 2px; }
  .sess-msg { font-size: 12.5px; line-height: 1.55; border-radius: var(--r-md); padding: 8px 11px; white-space: pre-wrap; word-break: break-word; }
  .sess-msg.user { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e3a5f; align-self: flex-end; max-width: 88%; }
  .sess-msg.assistant { background: var(--panel2); border: 1px solid var(--line); align-self: flex-start; max-width: 92%; }
  .sess-msg.tool { font-size: 11px; color: var(--dim); align-self: flex-start; padding: 2px 6px; }
  .sess-msg .who { display: block; font-size: 10px; font-weight: 700; color: var(--dim); margin-bottom: 3px; letter-spacing: .04em; }
  .sess-msg .mtime { font-weight: 400; color: var(--dim); opacity: .8; }
  .sess-msg.tool .mtime { font-size: 10px; }
  .sess-more { align-self: center; font: inherit; font-size: 11px; font-weight: 600; cursor: pointer; color: var(--secondary); background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px; margin-bottom: 2px; }
  .sess-more:hover { border-color: var(--dim); }
  .sess-empty { font-size: 12.5px; color: var(--dim); text-align: center; padding: 20px; }
  .sess-foot { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
  .sess-cmd { flex: 1; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; color: var(--secondary); background: var(--panel2); border: 1px solid var(--line); border-radius: var(--r-md); padding: 7px 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sess-copy { font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; border-radius: 999px; padding: 7px 14px; border: 1px solid var(--primary-500); background: var(--primary-500); color: #fff; white-space: nowrap; }
  .sess-copy:hover { filter: brightness(.97); }
  /* 설정 버튼 + 패널 */
  .settings-btn {
    font: inherit; font-size: 12px; font-weight: 600; color: var(--secondary);
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 999px; padding: 5px 12px; cursor: pointer; outline: none;
  }
  .settings-btn:hover { border-color: var(--dim); }
  .settings-ov {
    position: fixed; inset: 0; z-index: 60;
    display: flex; align-items: center; justify-content: center;
    background: rgba(10,12,18,.45); backdrop-filter: blur(3px);
  }
  .settings-card {
    width: min(440px, 90vw); background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: var(--r-lg);
    box-shadow: var(--sh-lg); padding: 18px 18px 16px;
    display: flex; flex-direction: column; gap: 14px;
    animation: talk-in .18s ease;
  }
  .settings-head { font-size: 16px; font-weight: 700; }
  .settings-head .settings-hint { font-size: 11px; font-weight: 500; color: var(--dim); margin-left: 6px; }
  .set-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .set-label { font-size: 14px; font-weight: 600; color: var(--secondary); }
  .set-row .theme-sel { min-width: 160px; }
  .settings-foot { font-size: 11px; color: var(--dim); line-height: 1.5; border-top: 1px solid var(--line); padding-top: 10px; }
  kbd {
    font: inherit; font-size: .85em; font-weight: 700; background: var(--panel2);
    border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; color: var(--secondary);
  }
  .controls-hint kbd { background: rgba(255,255,255,.18); border: none; color: #fff; }
  canvas#office {
    image-rendering: pixelated;
    border-radius: 10px;
    box-shadow: 0 8px 40px rgba(0,0,0,.15);
    cursor: pointer;
  }

  aside#panel {
    width: 340px; min-width: 340px;
    background: var(--bg);
    border-left: 1px solid var(--line);
    overflow-y: auto;
    padding: 16px;
  }
  aside h2 { font-size: 12px; color: var(--dim); margin: 2px 2px 12px; font-weight: 700; letter-spacing: 1.2px; }
  /* 헤더 사용량 미니바 (확대) */
  .hu { display: flex; align-items: center; gap: 22px; margin-right: 10px; }
  .hu-item { display: flex; align-items: center; gap: 9px; cursor: default; }
  .hu-lbl { font-size: 13px; color: var(--dim); }
  .hu-track { width: 120px; height: 10px; border-radius: 6px; background: #e4e7ec; overflow: hidden; }
  .hu-fill { display: block; height: 100%; width: 0; border-radius: 6px; background: var(--working); transition: width .4s ease; }
  .hu-pct { font-size: 15px; font-weight: 800; color: var(--text); min-width: 42px; text-align: right; }
  .hu-cost { font-size: 13px; color: var(--dim); font-weight: 600; }
  .hu-reset { display: none; }
  .item {
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 7px solid var(--unknown);
    border-radius: var(--r-md);
    padding: 12px 14px 12px;
    margin-bottom: 12px;
    cursor: pointer;
    box-shadow: var(--sh-sm);
    transition: box-shadow .15s, border-color .15s, transform .1s;
  }
  .item:hover { box-shadow: var(--sh-md); transform: translateY(-1px); }
  .item.working { border-left-color: var(--working); }
  .item.done { border-left-color: var(--done); }
  .item.blocked { border-left-color: var(--blocked); }
  .item.stalled { border-left-color: var(--stalled); }
  .item.unknown { border-left-color: var(--unknown); }
  .item.hl { border-color: var(--primary-500); box-shadow: 0 0 0 2px rgba(59,130,246,.35); }
  .item .row1 { display: flex; align-items: center; gap: 8px; }
  .item .name { font-size: 14px; line-height: 20px; font-weight: 700; color: var(--text); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Tags (Status) — 디자인 시스템 pill */
  .badge { font-size: 11px; line-height: 14px; padding: 4px 10px; border-radius: 999px; font-weight: 600; flex-shrink: 0; }
  .badge.working { background: #DCFCE7; color: #16A34A; }
  .badge.done { background: #DBEAFE; color: #2563EB; }
  .badge.blocked { background: #FEF3C7; color: #D97706; }
  .badge.stalled { background: #FEE2E2; color: #DC2626; }
  .badge.unknown { background: #F1F5F9; color: #64748B; }
  .item .resp {
    font-size: 12px; color: var(--secondary); margin-top: 8px; line-height: 16px;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .item .lastreq {
    font-size: 13px; color: var(--primary-700); margin-top: 8px; line-height: 1.5;
    background: var(--primary-50); border: 1px solid var(--primary-100); border-left: 3px solid var(--primary-500);
    border-radius: var(--r-sm); padding: 7px 9px;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .item .meta { font-size: 11px; line-height: 14px; color: var(--dim); margin-top: 9px; display: flex; gap: 10px; }

  #toasts { position: fixed; right: 350px; top: 64px; z-index: 50; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  .toast {
    background: #DBEAFE; border: 1px solid #BFDBFE;
    border-left: 5px solid var(--done);
    border-radius: var(--r-md); padding: 11px 16px; font-size: 14px; font-weight: 600; color: var(--text);
    box-shadow: var(--sh-lg);
    animation: slidein .25s ease;
  }
  .toast.working { border-left-color: var(--working); background: #DCFCE7; border-color: #BBF7D0; }
  .toast.done    { border-left-color: var(--done);    background: #DBEAFE; border-color: #BFDBFE; }
  .toast.blocked { border-left-color: var(--blocked); background: #FEF3C7; border-color: #FDE68A; }
  .toast.stalled { border-left-color: var(--stalled); background: #FEE2E2; border-color: #FECACA; }
  @keyframes slidein { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: none; } }
  .toast.bye { opacity: 0; transition: opacity .4s; }
</style>
</head>
<body>
  <header>
    <h1>🏢 Claude Office<span class="sub">세션 메타버스 모니터</span></h1>
    <div class="chips">
      <span class="chip working">작업중 <b id="c-working">0</b></span>
      <span class="chip blocked">입력 대기 <b id="c-blocked">0</b></span>
      <span class="chip stalled">멈춤 의심 <b id="c-stalled">0</b></span>
      <span class="chip done">완료 <b id="c-done">0</b></span>
    </div>
    <div class="spacer"></div>
    <a id="claude-status" class="cstatus" href="https://status.claude.com" target="_blank" rel="noopener" title="Claude 서비스 상태">
      <span class="cstatus-dot"></span><span class="cstatus-label">Claude 상태…</span>
    </a>
    <div id="usage" class="hu" style="display:none">
      <span class="hu-item" id="u5item"><span class="hu-lbl">5시간</span><span class="hu-track"><span class="hu-fill" id="u5fill"></span></span><span class="hu-pct" id="u5pct">–</span></span>
      <span class="hu-item" id="uwitem"><span class="hu-lbl">주간</span><span class="hu-track"><span class="hu-fill" id="uwfill"></span></span><span class="hu-pct" id="uwpct">–</span></span>
      <span class="hu-cost" id="ucost"></span>
      <span class="hu-reset" id="u5reset" hidden></span><span class="hu-reset" id="uwreset" hidden></span>
    </div>
    <button id="settings-btn" class="settings-btn" type="button" title="설정 ( , )">⚙ 설정</button>
    <label class="toggle"><input type="checkbox" id="hide-done" />완료 숨기기</label>
    <span id="conn">연결 중…</span>
  </header>
  <main>
    <div id="canvas-wrap"><canvas id="office" width="800" height="600"></canvas></div>
    <aside id="panel">
      <h2>SESSIONS</h2>
      <ul id="list" style="list-style:none;margin:0;padding:0"></ul>
    </aside>
  </main>
  <div id="toasts"></div>
  <div class="controls-hint">🎮 <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 이동 · <kbd>Enter</kbd> 말 걸기 · <kbd>,</kbd> 설정</div>
  <div id="settings" class="settings-ov" style="display:none">
    <div class="settings-card">
      <div class="settings-head">⚙ 설정 <span class="settings-hint"><kbd>,</kbd> / <kbd>Esc</kbd> 닫기</span></div>
      <!-- 설정 추가 시: .set-row 한 줄 추가 (라벨 + 컨트롤) -->
      <div class="set-row"><span class="set-label">테마</span><select id="theme-select" class="theme-sel" title="테마"></select></div>
      <div class="set-row"><span class="set-label">이동 속도</span><select id="speed-select" class="theme-sel" title="내 캐릭터 이동 속도"></select></div>
      <div class="set-row"><span class="set-label">패널 자동 갱신</span><select id="refresh-select" class="theme-sel" title="세션 내용 보기 갱신 주기"></select></div>
      <div class="set-row"><span class="set-label">대사 말풍선</span><select id="speech-select" class="theme-sel" title="캐릭터 상황별 대사 표시"></select></div>
      <div class="settings-foot">🎮 방향키/WASD 이동 · 세션에 다가가 <kbd>Enter</kbd> 내용 보기 · <kbd>Shift</kbd> 일시 질주</div>
    </div>
  </div>
  <div id="session" class="sess-ov" style="display:none">
    <div class="sess-card">
      <div class="sess-head">
        <span class="sess-name"></span>
        <span class="sess-badge"></span>
        <span class="sess-live" title="5초마다 자동 갱신"><i></i>자동 갱신</span>
        <button class="sess-x" type="button">닫기 (Esc)</button>
      </div>
      <div class="sess-detail"></div>
      <div class="sess-msgs"></div>
      <div class="sess-foot">
        <code class="sess-cmd" title="CLI 터미널에서 이 세션을 이어서 작업"></code>
        <button class="sess-copy" type="button">복사</button>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
